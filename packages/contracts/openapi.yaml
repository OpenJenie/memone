openapi: 3.1.0
info:
  title: Context Engineering API
  version: 0.1.0
servers:
  - url: http://localhost:4000/api
paths:
  /agents/register:
    post:
      summary: Register an autonomous agent
      responses:
        '201':
          description: Agent created
  /intents:
    post:
      summary: Submit an intent
      responses:
        '201':
          description: Intent accepted
  /intents/{id}/rollback:
    post:
      summary: Roll back an intent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Intent rolled back
